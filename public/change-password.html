<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Change Password - Question Paper Generator System
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(61, 174, 233, 0.15),
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom right,
                    rgba(245, 166, 35, 0.14),
                    transparent 35%
                ),

                #f5f7fb;

            color: #172033;

        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            width: 100%;

            background:
                linear-gradient(
                    135deg,
                    #142b63,
                    #1f4fa3,
                    #168bd1
                );

            color: white;

            padding:
                22px 45px;

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.15);

        }


        .header-left h1 {

            font-size: 26px;

            margin-bottom: 6px;

        }


        .header-left p {

            font-size: 14px;

            opacity: 0.88;

        }


        .back-btn {

            border: none;

            background: white;

            color: #17458f;

            padding:
                11px 20px;

            border-radius: 10px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;

        }


        .back-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 7px 18px
                rgba(0, 0, 0, 0.18);

        }


        /* =========================================
           MAIN
        ========================================= */

        .main {

            width: 100%;

            min-height:
                calc(100vh - 150px);

            display: flex;

            justify-content:
                center;

            align-items:
                flex-start;

            padding:
                55px 20px 40px;

        }


        /* =========================================
           PASSWORD CARD
        ========================================= */

        .password-card {

            position: relative;

            width: 100%;

            max-width: 560px;

            background:
                rgba(255, 255, 255, 0.97);

            border-radius: 22px;

            padding:
                38px;

            border:
                1px solid
                rgba(31, 79, 163, 0.08);

            box-shadow:
                0 18px 45px
                rgba(26, 55, 100, 0.13);

            overflow: hidden;

        }


        .password-card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #1f4fa3,
                    #3daee9,
                    #f5a623
                );

        }


        /* =========================================
           ICON
        ========================================= */

        .security-icon {

            width: 72px;

            height: 72px;

            border-radius: 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 36px;

            margin-bottom: 22px;

            background:
                linear-gradient(
                    135deg,
                    #eaf4ff,
                    #dceeff
                );

        }


        /* =========================================
           TITLE
        ========================================= */

        .password-card h2 {

            color: #173d82;

            font-size: 30px;

            margin-bottom: 9px;

        }


        .subtitle {

            color: #657089;

            font-size: 14px;

            line-height: 1.65;

            margin-bottom: 30px;

        }


        /* =========================================
           FORM
        ========================================= */

        .form-group {

            margin-bottom: 20px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #273b60;

            font-size: 14px;

            font-weight: bold;

        }


        .input-wrapper {

            position: relative;

        }


        .form-group input {

            width: 100%;

            height: 48px;

            padding:
                0 48px 0 15px;

            border:
                1px solid #d5ddeb;

            border-radius: 11px;

            background: #fbfcff;

            color: #172033;

            font-size: 14px;

            outline: none;

            transition:
                0.2s;

        }


        .form-group input:focus {

            border-color:
                #2586cf;

            background: white;

            box-shadow:
                0 0 0 4px
                rgba(37, 134, 207, 0.10);

        }


        .form-group input::placeholder {

            color: #9aa5b8;

        }


        /* =========================================
           SHOW PASSWORD BUTTON
        ========================================= */

        .toggle-password {

            position: absolute;

            right: 10px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #54709a;

            cursor: pointer;

            font-size: 18px;

            padding: 5px;

        }


        .toggle-password:hover {

            color: #1f4fa3;

        }


        /* =========================================
           PASSWORD INFO
        ========================================= */

        .password-info {

            margin-top: 8px;

            color: #78859a;

            font-size: 12px;

        }


        /* =========================================
           BUTTONS
        ========================================= */

        .button-row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

            margin-top: 28px;

        }


        .primary-btn,
        .secondary-btn {

            border: none;

            height: 48px;

            border-radius: 11px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;

        }


        .primary-btn {

            background:
                linear-gradient(
                    135deg,
                    #1f4fa3,
                    #197bc4
                );

            color: white;

            box-shadow:
                0 7px 18px
                rgba(31, 79, 163, 0.22);

        }


        .primary-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 22px
                rgba(31, 79, 163, 0.30);

        }


        .primary-btn:disabled {

            opacity: 0.6;

            cursor:
                not-allowed;

            transform:
                none;

        }


        .secondary-btn {

            background:
                #eef3f9;

            color:
                #27466f;

            border:
                1px solid #dce4ef;

        }


        .secondary-btn:hover {

            background:
                #e4ebf5;

            transform:
                translateY(-2px);

        }


        /* =========================================
           STATUS
        ========================================= */

        #statusMessage {

            display: none;

            margin-top: 20px;

            padding:
                12px 14px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.5;

        }


        #statusMessage.success {

            display: block;

            background:
                #eaf8ef;

            color:
                #19713a;

            border:
                1px solid #bde5c9;

        }


        #statusMessage.error {

            display: block;

            background:
                #fff0f0;

            color:
                #a52222;

            border:
                1px solid #f0c4c4;

        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            text-align: center;

            padding:
                25px 20px;

            color:
                #7a8497;

            font-size: 13px;

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 650px) {

            .header {

                padding:
                    18px 20px;

                flex-direction:
                    column;

                align-items:
                    flex-start;

                gap: 16px;

            }


            .header-left h1 {

                font-size: 22px;

            }


            .back-btn {

                width: 100%;

            }


            .main {

                padding:
                    30px 16px;

            }


            .password-card {

                padding:
                    28px 22px;

                border-radius:
                    18px;

            }


            .password-card h2 {

                font-size: 26px;

            }

        }


        @media (max-width: 430px) {

            .button-row {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

    <div class="header-left">

        <h1>
            Galgotias University
        </h1>

        <p>
            Question Paper Generator System
        </p>

    </div>


    <button
        type="button"
        class="back-btn"
        onclick="window.location.href='settings.html'"
    >
        ← Settings
    </button>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main class="main">

    <div class="password-card">


        <div class="security-icon">
            🔐
        </div>


        <h2>
            Change Password
        </h2>


        <p class="subtitle">

            Update the password used to access your
            Question Paper Generator System.
            Keep your new password secure.

        </p>



        <!-- CURRENT PASSWORD -->

        <div class="form-group">

            <label for="currentPassword">
                Current Password
            </label>

            <div class="input-wrapper">

                <input
                    type="password"
                    id="currentPassword"
                    placeholder="Enter current password"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="currentPassword"
                    title="Show password"
                >
                    👁
                </button>

            </div>

        </div>



        <!-- NEW PASSWORD -->

        <div class="form-group">

            <label for="newPassword">
                New Password
            </label>

            <div class="input-wrapper">

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="newPassword"
                    title="Show password"
                >
                    👁
                </button>

            </div>

            <div class="password-info">
                Minimum 6 characters.
            </div>

        </div>



        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label for="confirmPassword">
                Confirm New Password
            </label>

            <div class="input-wrapper">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter new password"
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="confirmPassword"
                    title="Show password"
                >
                    👁
                </button>

            </div>

        </div>



        <!-- STATUS -->

        <div
            id="statusMessage"
        ></div>



        <!-- BUTTONS -->

        <div class="button-row">

            <button
                id="changePasswordBtn"
                type="button"
                class="primary-btn"
            >
                Change Password
            </button>


            <button
                type="button"
                class="secondary-btn"
                onclick="window.location.href='settings.html'"
            >
                Cancel
            </button>

        </div>


    </div>

</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer class="footer">

    © 2026 Galgotias University -
    Question Paper Generator System

</footer>



<script>


// =========================================
// ELEMENTS
// =========================================

const currentPassword =
    document.getElementById(
        "currentPassword"
    );


const newPassword =
    document.getElementById(
        "newPassword"
    );


const confirmPassword =
    document.getElementById(
        "confirmPassword"
    );


const changePasswordBtn =
    document.getElementById(
        "changePasswordBtn"
    );


const statusMessage =
    document.getElementById(
        "statusMessage"
    );



// =========================================
// STATUS MESSAGE
// =========================================

function showStatus(
    message,
    type
) {

    statusMessage.textContent =
        message;

    statusMessage.className =
        type;

}



// =========================================
// SHOW / HIDE PASSWORD
// =========================================

document
    .querySelectorAll(
        ".toggle-password"
    )
    .forEach(
        function (button) {

            button.addEventListener(
                "click",
                function () {

                    const targetId =
                        button.dataset.target;

                    const input =
                        document.getElementById(
                            targetId
                        );


                    if (
                        input.type ===
                        "password"
                    ) {

                        input.type =
                            "text";

                        button.textContent =
                            "🙈";

                        button.title =
                            "Hide password";

                    } else {

                        input.type =
                            "password";

                        button.textContent =
                            "👁";

                        button.title =
                            "Show password";

                    }

                }
            );

        }
    );



// =========================================
// CHANGE PASSWORD
// =========================================

changePasswordBtn.addEventListener(
    "click",
    async function () {


        showStatus(
            "",
            ""
        );


        const current =
            currentPassword.value.trim();


        const newPass =
            newPassword.value;


        const confirm =
            confirmPassword.value;



        // CURRENT PASSWORD

        if (!current) {

            showStatus(
                "Please enter your current password.",
                "error"
            );

            currentPassword.focus();

            return;

        }



        // NEW PASSWORD

        if (!newPass) {

            showStatus(
                "Please enter a new password.",
                "error"
            );

            newPassword.focus();

            return;

        }



        // PASSWORD LENGTH

        if (
            newPass.length < 6
        ) {

            showStatus(
                "New password must contain at least 6 characters.",
                "error"
            );

            newPassword.focus();

            return;

        }



        // CONFIRM PASSWORD

        if (
            newPass !== confirm
        ) {

            showStatus(
                "New password and confirm password do not match.",
                "error"
            );

            confirmPassword.value =
                "";

            confirmPassword.focus();

            return;

        }



        // SAME PASSWORD

        if (
            current === newPass
        ) {

            showStatus(
                "New password must be different from your current password.",
                "error"
            );

            newPassword.focus();

            return;

        }



        // DISABLE BUTTON

        changePasswordBtn.disabled =
            true;

        changePasswordBtn.textContent =
            "Changing...";



        try {


            const response =
                await fetch(
                    "/api/auth/change-password",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        credentials:
                            "include",

                        body:
                            JSON.stringify({

                                currentPassword:
                                    current,

                                newPassword:
                                    newPass

                            })

                    }
                );



            const data =
                await response
                    .json()
                    .catch(
                        function () {
                            return {};
                        }
                    );



            // SUCCESS

            if (
                response.ok &&
                data.success
            ) {

                showStatus(
                    "Password changed successfully. Redirecting to Settings...",
                    "success"
                );


                currentPassword.value =
                    "";

                newPassword.value =
                    "";

                confirmPassword.value =
                    "";



                setTimeout(
                    function () {

                        window.location.href =
                            "settings.html";

                    },
                    1200
                );


                return;

            }



            // ERROR

            showStatus(
                data.message ||
                "Unable to change password.",
                "error"
            );


        } catch (error) {

            console.error(
                "Change Password Error:",
                error
            );


            showStatus(
                "Unable to connect to the server.",
                "error"
            );


        } finally {

            changePasswordBtn.disabled =
                false;

            changePasswordBtn.textContent =
                "Change Password";

        }

    }
);



// =========================================
// ENTER KEY SUPPORT
// =========================================

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            changePasswordBtn.click();

        }

    }
);

</script>


</body>

</html>
